[package]
name = "capmonstercloud-client"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Official CapMonster Cloud async Rust SDK: captcha solver & captcha bypass for reCAPTCHA v2/v3/Enterprise, Cloudflare Turnstile, DataDome, GeeTest, Amazon WAF, FunCaptcha and 20+ captcha types. A 2captcha and capsolver alternative"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CapMonsterCloud/capmonster-rust-captcha-solver"
homepage = "https://capmonster.cloud"
documentation = "https://docs.rs/capmonstercloud-client"
keywords = ["captcha", "captcha-solver", "capmonster", "recaptcha", "2captcha-alternative"]
categories = ["api-bindings", "asynchronous"]
exclude = [".github/"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
